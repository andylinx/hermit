# Full 30-case training score; no small-prefix utility rejection. Frozen split ownership.
data:
  tasks: data/thirty-v1/tasks.jsonl
  train: data/thirty-v1/train.txt
  val: data/thirty-v1/val.txt
  test: data/thirty-v1/test.txt
  step_size: 30
  shuffle: false
task_info: task-info
template: evosafe@1.0
agent:
  name: hermit.integrations.agentdyn:run
  concurrency: 6
  timeout_min: 15
  params:
    model: nvidia/nvidia/llama-3.3-nemotron-super-49b-v1.5
    api_script: ~/project/api3.py
    benchmark_version: v1.2.2
    max_iters: 25
    max_tokens: 8192
    temperature: 0.0
    request_timeout_s: 120
    max_retries: 1
    logs: runs/thirty-episodes
    auditor:
      enabled: true
      max_calls: 4
      max_chars: 8000
      max_tokens: 2048
      timeout_s: 45
judge:
  path: judge.py
evolver:
  name: evosafe
  params:
    proposer: codex
    codex_timeout_s: 600
    max_clean_drop: 0.0
    min_improvement: 0.0
    search_mode: roles
    max_proposals: 3
    cascade_sizes:
    - 30
    evaluation_repeats: 1
    eval_task_ids:
    - shopping-user_task_0-clean
    - github-user_task_4-clean
    - dailylife-user_task_3-clean
    - shopping-user_task_0-injection_task_0-fa88dd03
