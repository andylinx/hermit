data:
  tasks: data/tasks.jsonl
  train: data/train.txt
  val: data/val.txt
  test: data/test.txt
  step_size: 4
  shuffle: false
task_info: task-info
template: evosafe@1.0
agent:
  name: hermit.integrations.agentdyn:run
  concurrency: 1
  timeout_min: 10
  params:
    model: gpt-4o-mini-2024-07-18
    benchmark_version: v1.2.2
    max_iters: 15
    logs: runs/episodes
judge:
  path: judge.py
evolver:
  name: evosafe
  params:
    max_clean_drop: 0.0
    min_improvement: 0.0
# Configure llm (the proposer) with your own backend before training.
llm: null
sandbox:
  enabled: true
  enforce: required
  network: isolated
  allow: [api.openai.com]
  profiles:
    rollout:
      network: isolated
      allow: [api.openai.com]
trainer:
  run_name: agentdyn-shopping
  output_dir: runs
  epochs: 1
  call_timeout_min: 30
  budget:
    hours: 1
