# Frozen expanded acceptance run: independent Codex roles, no remote publication.
data:
  tasks: data/expanded-v2/tasks.jsonl
  train: data/expanded-v2/train.txt
  val: data/expanded-v2/val.txt
  test: data/expanded-v2/test.txt
  step_size: 18
  shuffle: false
task_info: task-info
template: evosafe@1.0
agent:
  name: hermit.integrations.agentdyn:run
  concurrency: 6
  timeout_min: 15
  params:
    model: nvidia/nvidia/llama-3.3-nemotron-super-49b-v1.5
    api_script: ~/project/api3.py
    benchmark_version: v1.2.2
    max_iters: 25
    max_tokens: 8192
    temperature: 0.0
    request_timeout_s: 120
    max_retries: 1
    logs: runs/expanded-episodes
    auditor:
      enabled: true
      max_calls: 4
      max_chars: 8000
      max_tokens: 2048
      timeout_s: 45
judge:
  path: judge.py
evolver:
  name: evosafe
  params:
    proposer: codex
    codex_timeout_s: 600
    max_clean_drop: 0.0
    min_improvement: 0.0
    search_mode: roles
    max_proposals: 3
    cascade_sizes:
    - 6
    - 12
    evaluation_repeats: 1
    eval_task_ids:
    - shopping-user_task_0-clean
    - github-user_task_4-clean
    - dailylife-user_task_3-clean
    - shopping-user_task_0-injection_task_0-fa88dd03
    - github-user_task_4-injection_task_0-7517e44b
    - dailylife-user_task_3-injection_task_0-5cc9b8be
    - shopping-user_task_0-injection_task_1-8db1f166
    - github-user_task_4-injection_task_1-01330669
    - dailylife-user_task_3-injection_task_1-9b285374
    - shopping-user_task_2-clean
    - github-user_task_17-clean
    - dailylife-user_task_0-clean
    - shopping-user_task_2-injection_task_2-905a440c
    - github-user_task_17-injection_task_2-8ccc1edd
    - dailylife-user_task_0-injection_task_2-7b48a4c9
    - shopping-user_task_2-injection_task_3-2b63f1b6
    - github-user_task_17-injection_task_3-8ef3f2f4
    - dailylife-user_task_0-injection_task_3-2c7c977e
    robustness_task_ids:
    - shopping-user_task_15-clean
    - github-user_task_6-clean
    - dailylife-user_task_14-clean
    - shopping-user_task_15-injection_task_4-bdf5ff28
    - github-user_task_6-injection_task_4-54f43420
    - dailylife-user_task_14-injection_task_4-24b44389
    - shopping-user_task_15-injection_task_5-2f0dd73d
    - github-user_task_6-injection_task_5-afeff7d8
    - dailylife-user_task_14-injection_task_5-635b71cc
    - shopping-user_task_14-clean
    - github-user_task_11-clean
    - dailylife-user_task_4-clean
    - shopping-user_task_14-injection_task_6-ec9d8341
    - github-user_task_11-injection_task_6-2d00a324
    - dailylife-user_task_4-injection_task_6-6130eb2d
