sandbox:
  enabled: false
trainer:
  run_name: nemotron-agentdyn-expanded-v2
  output_dir: runs
  epochs: 1
  call_timeout_min: 100
  budget:
    hours: 3
    tokens: 12000000
  tree_dir: runs/trees/evosafe-expanded-v2
